apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eks-python-app.fullname" . }}
  labels:
    {{- include "eks-python-app.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "eks-python-app.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "eks-python-app.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

    spec:
      serviceAccountName: {{ include "eks-python-app.serviceAccountName" . }}

      containers:
        - name: {{ .Chart.Name }}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP

          env:
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}

            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}

            - name: PORT
              value: {{ .Values.containerPort | quote }}

            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}

            - name: AWS_DEFAULT_REGION
              value: {{ .Values.aws.region | quote }}

            - name: S3_BUCKET_NAME
              value: {{ .Values.aws.s3.bucketName | quote }}

            - name: S3_OBJECT_KEY
              value: {{ .Values.aws.s3.objectKey | quote }}

            - name: SECRET_NAME
              value: {{ .Values.aws.secretsManager.secretName | quote }}

          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          {{- end }}

          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}