apiVersion: v1
kind: Service
metadata:
  name: {{ include "eks-python-app.fullname" . }}
  labels:
    {{- include "eks-python-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP

  selector:
    {{- include "eks-python-app.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: 9010
      targetPort: http
      protocol: TCP